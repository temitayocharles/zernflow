name: Migrate Flow Sends

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ["forgejo-general"]
    container:
      image: python:3.13-bookworm
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD

      - name: Replace hosted send implementation
        shell: sh
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/flow-engine/engine.ts")
          text = path.read_text()
          start_marker = "async function sendFirstMessageAsPrivateReply("
          end_marker = "async function executeCondition("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("flow send migration markers were not found")
          replacement = '''async function executeSendMessage(
            supabase: SupabaseClient<Database>,
            data: SendMessageNodeData,
            context: FlowExecutionContext,
            sessionId: string,
            nodeId: string,
          ) {
            if (!context.platform) {
              const { data: channel, error: channelError } = await supabase
                .from("channels")
                .select("platform")
                .eq("id", context.channelId)
                .eq("workspace_id", context.workspaceId)
                .single();

              if (channelError || !channel) {
                throw new Error(
                  channelError?.message ?? `Channel ${context.channelId} is unavailable`,
                );
              }
              context.platform = channel.platform;
            }

            let gatewayConversationId = context.lateConversationId;
            if (!gatewayConversationId) {
              const { data: conversation, error: conversationError } = await supabase
                .from("conversations")
                .select("late_conversation_id")
                .eq("id", context.conversationId)
                .eq("workspace_id", context.workspaceId)
                .single();

              if (conversationError) {
                throw new Error(conversationError.message);
              }
              gatewayConversationId = conversation?.late_conversation_id ?? undefined;
            }

            if (!gatewayConversationId) {
              if (context.variables?.comment_id && context.variables?.post_id) {
                throw new Error(
                  "Agent Social Gateway private comment replies are not commissioned",
                );
              }
              throw new Error(
                `No Agent Social Gateway conversation ID is projected for ${context.conversationId}`,
              );
            }

            const gateway = requireSocialGatewayClient();
            for (const [messageIndex, message] of data.messages.entries()) {
              const reply = buildGatewayFlowReply({
                message,
                platform: context.platform,
                variables: context.variables ?? {},
                workspaceId: context.workspaceId,
                flowId: context.flowId,
                sessionId,
                nodeId,
                messageIndex,
              });

              try {
                const operation = await gateway.replyToConversation(
                  gatewayConversationId,
                  reply,
                );
                const { error: analyticsError } = await supabase
                  .from("analytics_events")
                  .insert({
                    workspace_id: context.workspaceId,
                    flow_id: context.flowId,
                    contact_id: context.contactId,
                    event_type: "message_sent",
                    metadata: {
                      delivery: "durable_gateway_operation",
                      operation_id: operation.id,
                      operation_status: operation.status,
                    },
                  });
                if (analyticsError) {
                  console.error("[flow-engine] message analytics failed", {
                    flowId: context.flowId,
                    nodeId,
                    operationId: operation.id,
                    error: analyticsError.message,
                  });
                }
              } catch (error) {
                const errorMessage =
                  error instanceof Error ? error.message.slice(0, 512) : "Unknown error";
                const { error: analyticsError } = await supabase
                  .from("analytics_events")
                  .insert({
                    workspace_id: context.workspaceId,
                    flow_id: context.flowId,
                    contact_id: context.contactId,
                    event_type: "message_failed",
                    metadata: {
                      delivery: "durable_gateway_operation",
                      node_id: nodeId,
                      message_index: messageIndex,
                      error: errorMessage,
                    },
                  });
                if (analyticsError) {
                  console.error("[flow-engine] message failure analytics failed", {
                    flowId: context.flowId,
                    nodeId,
                    error: analyticsError.message,
                  });
                }
                throw error;
              }
            }
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check

      - name: Commit migration
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Flow Migration"
          git config user.email "flow-migration@users.noreply.forgejo"
          git add lib/flow-engine/engine.ts
          git commit -m "refactor: route flow messages through durable gateway"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
