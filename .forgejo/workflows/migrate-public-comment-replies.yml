name: Migrate Public Comment Replies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SOCIAL_GATEWAY_BASE_URL: https://gateway.example.test
      SOCIAL_GATEWAY_API_KEY: ci-social-gateway-key-with-at-least-24-characters
      SOCIAL_GATEWAY_WEBHOOK_SECRET: ci-social-gateway-webhook-secret
      CRON_SECRET: ci-cron-secret-with-at-least-24-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git python3
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD
          npm ci --no-audit --no-fund

      - name: Apply and validate migration
        shell: sh
        run: |
          set -eu
          python3 scripts/migrate_public_comment_replies.py
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check

      - name: Commit migration
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Comment Reply Migration"
          git config user.email "comment-reply-migration@users.noreply.forgejo"
          git add \
            lib/comment-processor.ts \
            lib/social-gateway/webhook-processor.ts
          git rm -f \
            scripts/migrate_public_comment_replies.py \
            .forgejo/workflows/migrate-public-comment-replies.yml
          git commit -m "refactor: route public comment replies through gateway"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
