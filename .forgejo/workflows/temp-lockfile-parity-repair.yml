name: TEMP lockfile parity repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    steps:
      - name: Fetch import branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "$token"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=20 origin sync/lm-arena-zernflow-rest-20260911
          git checkout -B sync/lm-arena-zernflow-rest-20260911 FETCH_HEAD

      - name: Replace lockfile from immutable Arena commit
        shell: sh
        run: |
          set -eu
          SOURCE_SHA='b45ea5b5b7e731dfabd0af530e7aec12ddb3a1d9'
          EXPECTED_BLOB='b9bb517b3b7f6223bbd54a96023ad60db88f737c'
          EXPECTED_SIZE='328068'
          URL="https://raw.githubusercontent.com/temitayocharles/zernflow/${SOURCE_SHA}/package-lock.json"
          curl --fail --silent --show-error --location "$URL" --output /tmp/package-lock.json
          test "$(wc -c < /tmp/package-lock.json | tr -d ' ')" = "$EXPECTED_SIZE"
          test "$(git hash-object /tmp/package-lock.json)" = "$EXPECTED_BLOB"
          cp /tmp/package-lock.json package-lock.json
          test "$(git hash-object package-lock.json)" = "$EXPECTED_BLOB"

      - name: Commit exact lockfile
        shell: sh
        run: |
          set -eu
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already exact'
            exit 0
          fi
          git config user.name 'Forgejo Actions'
          git config user.email 'actions@tayoca.com'
          git add package-lock.json
          git commit -m 'fix(sync): restore exact Arena lockfile'
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "$token"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:sync/lm-arena-zernflow-rest-20260911
