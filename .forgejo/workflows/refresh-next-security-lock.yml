name: Refresh secure Next.js lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ["forgejo-container"]
    container:
      image: node:24-bookworm
    env:
      TARGET_BRANCH: fix/next-16.3.4-audit
    steps:
      - name: Fetch exact repair branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" FETCH_HEAD

      - name: Regenerate secure Next.js lockfile
        shell: sh
        run: |
          set -eu
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund "next@^16.3.4"
          node -e 'const p=require("./package-lock.json"); const v=p.packages["node_modules/next"].version; if (v !== "16.3.4") throw new Error(`Expected Next 16.3.4, got ${v}`); console.log(`Locked Next.js ${v}`)'

      - name: Commit generated lockfile
        shell: sh
        run: |
          set -eu
          rm -f .forgejo/workflows/refresh-next-security-lock.yml
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@users.noreply.forgejo.tca-infraforge.site"
          git add package.json package-lock.json .forgejo/workflows/refresh-next-security-lock.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No dependency changes generated"; exit 1; }
          git commit -m "fix(deps): upgrade Next.js to 16.3.4"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" push origin "HEAD:refs/heads/${TARGET_BRANCH}"
