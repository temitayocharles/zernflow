name: Diagnose ZernFlow CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ["forgejo-container"]
    container:
      image: node:24-bookworm
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret-with-at-least-24-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      TARGET_BRANCH: fix/next-16.3.4-audit
    steps:
      - name: Fetch exact repair branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" FETCH_HEAD

      - name: Capture CI stage results
        shell: sh
        run: |
          set -eu
          report="docs/CI_DIAGNOSTICS_TMP.md"
          printf '# Temporary CI diagnostics\n\nGenerated by a one-shot workflow on the Next.js security repair branch.\n' > "$report"

          run_stage() {
            stage="$1"
            shift
            tmp="$(mktemp)"
            set +e
            "$@" >"$tmp" 2>&1
            rc=$?
            set -e
            {
              printf '\n## %s\n\nExit code: `%s`\n\n```text\n' "$stage" "$rc"
              tail -n 220 "$tmp"
              printf '\n```\n'
            } >> "$report"
            rm -f "$tmp"
          }

          run_stage "npm ci" npm ci --no-audit --no-fund
          run_stage "production audit" npm audit --omit=dev --audit-level=high
          run_stage "lint" npm run lint
          run_stage "typecheck" npm run typecheck
          run_stage "tests" npm test
          run_stage "production build" npm run build

      - name: Commit diagnostics and self-remove
        shell: sh
        run: |
          set -eu
          rm -f .forgejo/workflows/diagnose-ci.yml
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@users.noreply.forgejo.tca-infraforge.site"
          git add docs/CI_DIAGNOSTICS_TMP.md .forgejo/workflows/diagnose-ci.yml
          git diff --cached --check
          git commit -m "chore(ci): capture temporary repair diagnostics"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" push origin "HEAD:refs/heads/${TARGET_BRANCH}"
