name: Diagnose ZernFlow CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: CI stage to reproduce after a locked install
        required: true
        default: audit

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret-with-at-least-24-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      TARGET_BRANCH: fix/next-16.3.4-audit
    steps:
      - name: Fetch exact repair branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          git checkout --detach FETCH_HEAD

      - name: Install locked dependencies
        shell: sh
        run: npm ci --no-audit --no-fund

      - name: Run selected CI stage
        shell: sh
        env:
          DIAG_STAGE: ${{ inputs.stage }}
        run: |
          set -eu
          echo "Reproducing CI stage: ${DIAG_STAGE}"
          case "${DIAG_STAGE}" in
            install) true ;;
            audit) npm audit --omit=dev --audit-level=high ;;
            lint) npm run lint ;;
            typecheck) npm run typecheck ;;
            test) npm test ;;
            build) npm run build ;;
            *) echo "Unsupported stage: ${DIAG_STAGE}" >&2; exit 64 ;;
          esac
