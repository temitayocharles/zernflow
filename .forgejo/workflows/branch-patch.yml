name: Controlled Branch Patch

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Repository-relative UTF-8 file path
        required: true
        type: string
      old_b64:
        description: Base64 encoded exact text to replace
        required: true
        type: string
      new_b64:
        description: Base64 encoded replacement text
        required: true
        type: string
      commit_message:
        description: Commit message
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ["forgejo-general"]
    container:
      image: python:3.13-bookworm
    env:
      PATCH_FILE_PATH: ${{ inputs.file_path }}
      PATCH_OLD_B64: ${{ inputs.old_b64 }}
      PATCH_NEW_B64: ${{ inputs.new_b64 }}
      PATCH_COMMIT_MESSAGE: ${{ inputs.commit_message }}
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD

      - name: Apply verified replacement
        shell: sh
        run: |
          set -eu
          case "${PATCH_FILE_PATH}" in
            /*|*..*) echo "unsafe file path" >&2; exit 1 ;;
          esac
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ["PATCH_FILE_PATH"])
          old = base64.b64decode(os.environ["PATCH_OLD_B64"]).decode()
          new = base64.b64decode(os.environ["PATCH_NEW_B64"]).decode()
          text = path.read_text()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one exact replacement, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit patch
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Controlled Patch"
          git config user.email "controlled-patch@users.noreply.forgejo"
          git add -- "${PATCH_FILE_PATH}"
          git commit -m "${PATCH_COMMIT_MESSAGE}"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
