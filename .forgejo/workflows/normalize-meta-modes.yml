name: Normalize Meta file modes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  normalize:
    runs-on: forgejo-general
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-owner-oauth-2026-08-06
          fetch-depth: 1
      - name: Normalize and push
        shell: bash
        run: |
          set -euo pipefail
          chmod 0644 '.env.example' 'app/(dashboard)/dashboard/channels/callback/page.tsx' 'app/(dashboard)/dashboard/channels/channels-view.tsx' 'app/(dashboard)/dashboard/channels/page.tsx' 'app/api/v1/channels/connect/route.test.ts' 'app/api/v1/channels/connect/route.ts' 'lib/social-gateway/client.test.ts' 'lib/social-gateway/client.ts' 'lib/social-gateway/comment-reply.test.ts' 'lib/social-gateway/types.ts'
          rm -f .forgejo/workflows/normalize-meta-modes.yml
          git config user.name 'Forgejo Meta Transplant'
          git config user.email 'meta-transplant@users.noreply.forgejo'
          git add -A
          git commit -m 'fix: normalize Meta patch file modes'
          git push origin HEAD:feature/meta-owner-oauth-2026-08-06
