name: Apply Durable Sequence Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git python3
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD
          npm ci

      - name: Apply and validate migration
        shell: sh
        run: |
          set -eu
          python3 scripts/migrate_sequence_gateway.py
          npm run lint
          npm run typecheck
          npm test -- --run lib/social-gateway/operation-client.test.ts
          git diff --check

      - name: Commit migration
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Sequence Migration"
          git config user.email "sequence-migration@users.noreply.forgejo"
          git add lib/sequence-processor.ts lib/types/database.ts
          git commit -m "refactor: route sequences through durable gateway"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
