name: Install Server Only Dependency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD

      - name: Install explicit server boundary package
        shell: sh
        run: |
          set -eu
          npm install --save-exact server-only@0.0.1
          npm test -- --run lib/comment-processor.test.ts
          git diff --check

      - name: Commit dependency
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Dependency Install"
          git config user.email "dependency-install@users.noreply.forgejo"
          git add package.json package-lock.json
          git commit -m "fix: install explicit server-only boundary"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
