name: Mirror canonical Forgejo refs to GitHub

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgejo-to-github-${{ forgejo.ref || github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ["forgejo-general"]
    env:
      GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITHUB_REPO_URL: https://github.com/temitayocharles/zernflow.git
    steps:
      - name: Skip until mirror credential is configured
        shell: sh
        run: |
          if [ -z "${GH_MIRROR_TOKEN:-}" ]; then
            echo "GH_MIRROR_TOKEN is not configured; mirror is inactive."
            exit 0
          fi

      - name: Fetch current Forgejo ref
        if: env.GH_MIRROR_TOKEN != ''
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add forgejo "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          source_token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${source_token}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          branch="${ref#refs/heads/}"
          git -c http.extraHeader="Authorization: token ${source_token}" fetch forgejo "refs/heads/${branch}"
          git checkout --detach FETCH_HEAD
          printf '%s' "${branch}" > /tmp/mirror_branch

      - name: Fast-forward ref to GitHub
        if: env.GH_MIRROR_TOKEN != ''
        shell: sh
        run: |
          set -eu
          branch="$(cat /tmp/mirror_branch)"
          git remote add github "${GITHUB_REPO_URL}"
          git -c http.extraHeader="Authorization: Bearer ${GH_MIRROR_TOKEN}" fetch github "refs/heads/${branch}:refs/remotes/github/${branch}" || true

          if git show-ref --verify --quiet "refs/remotes/github/${branch}"; then
            if ! git merge-base --is-ancestor "refs/remotes/github/${branch}" HEAD; then
              echo "GitHub branch has commits not present in canonical Forgejo. Refusing non-fast-forward sync."
              exit 1
            fi
          fi

          git -c http.extraHeader="Authorization: Bearer ${GH_MIRROR_TOKEN}"             push github "HEAD:refs/heads/${branch}"
