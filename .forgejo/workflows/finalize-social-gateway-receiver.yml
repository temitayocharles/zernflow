name: Finalize Social Gateway Receiver

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ["forgejo-general"]
    container:
      image: node:24-bookworm
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SOCIAL_GATEWAY_WEBHOOK_SECRET: ci-social-gateway-webhook-secret
      CRON_SECRET: ci-cron-secret-with-at-least-24-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Fetch branch
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git python3
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}.git"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          test -n "${token}"
          git -c http.extraHeader="Authorization: token ${token}" fetch --depth=1 origin refs/heads/feature/foundation-gateway-seam
          git checkout -B feature/foundation-gateway-seam FETCH_HEAD
          npm ci --no-audit --no-fund

      - name: Apply and validate receiver integration
        shell: sh
        run: |
          set -eu
          python3 scripts/finalize_social_gateway_receiver.py
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check

      - name: Commit receiver integration
        shell: sh
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          git config user.name "Forgejo Gateway Receiver Finalizer"
          git config user.email "gateway-receiver@users.noreply.forgejo"
          git add \
            .env.example \
            app/api/cron/jobs/route.ts \
            lib/comment-processor.ts \
            lib/types/database.ts
          git rm -f \
            scripts/finalize_social_gateway_receiver.py \
            .forgejo/workflows/finalize-social-gateway-receiver.yml
          git commit -m "feat: finalize durable social gateway receiver"
          git -c http.extraHeader="Authorization: token ${token}" push origin HEAD:refs/heads/feature/foundation-gateway-seam
