name: Apply Vault-managed secret boundary

on:
  push:
    branches:
      - feature/vault-managed-secrets
    paths:
      - .bootstrap/vault-secrets.patch.gz.b64
      - .github/workflows/apply-vault-secrets.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vault-managed-secrets
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/vault-secrets.patch.gz.b64 | gzip --decompress > /tmp/vault-secrets.patch
          git apply --index /tmp/vault-secrets.patch
          git rm .bootstrap/vault-secrets.patch.gz.b64 .github/workflows/apply-vault-secrets.yml
      - name: Commit canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Temitayo Charles'
          git config user.email 'temitayo_charles@yahoo.com'
          git commit -m 'security: move runtime secrets behind Vault boundary'
          git push origin HEAD:feature/vault-managed-secrets
